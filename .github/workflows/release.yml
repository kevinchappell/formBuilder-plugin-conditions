name: Release

# Runs semantic-release on every push to main: analyses conventional commits, tags the next
# version, publishes to npm, and creates the GitHub release. GitHub auth uses the built-in
# GITHUB_TOKEN. npm auth uses trusted publishing (OIDC via id-token: write) once the trusted
# publisher is configured on npmjs.com; until then, an NPM_TOKEN repository secret is used if set.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create tags and GitHub releases
      issues: write          # comment on released issues
      pull-requests: write   # comment on released pull requests
      id-token: write        # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm test
      - run: npm run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
